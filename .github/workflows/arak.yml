name: Timárvasker árak frissítése

on:
  schedule:
    - cron: "17 4 * * *"   # minden nap reggel (UTC 4:17)
  workflow_dispatch:        # kézzel is indítható az Actions fülön

permissions:
  contents: write

jobs:
  arak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - run: python scripts/update_prices.py
      - name: Változás mentése
        run: |
          if git diff --quiet prices.json; then
            echo "Nincs árváltozás."
          else
            git config user.name "arfrissito-bot"
            git config user.email "actions@users.noreply.github.com"
            git add prices.json
            git commit -m "Árak frissítése $(date +%F)"
            git push
          fi
